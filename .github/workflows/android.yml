name: Android build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          grep -qF "versionName = \"${GITHUB_REF_NAME#v}\"" app/build.gradle.kts ||
            { echo "::error::tag $GITHUB_REF_NAME does not match versionName in app/build.gradle.kts"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (core logic)
        run: ./gradlew :core:test --no-daemon

      - name: Naver Map client ID
        run: echo "naverMapClientId=${{ secrets.NAVER_MAP_CLIENT_ID }}" >> local.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: runner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # 태그 릴리스만 실 광고 ID + 서명 키로 릴리스 빌드. 시크릿이 없으면 서명 안 된 APK 대신 실패시킨다.
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_NATIVE_ID: ${{ secrets.ADMOB_NATIVE_ID }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD ADMOB_APP_ID ADMOB_NATIVE_ID; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is missing"; exit 1; }
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "releaseStoreFile=$RUNNER_TEMP/release.jks"
            echo "releaseStorePassword=$STORE_PASSWORD"
            echo "releaseKeyAlias=$KEY_ALIAS"
            echo "releaseKeyPassword=$KEY_PASSWORD"
            echo "admobAppId=$ADMOB_APP_ID"
            echo "admobNativeId=$ADMOB_NATIVE_ID"
          } >> local.properties
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Upload release APK and AAB
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: runner-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: runner-release-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk="runner-${GITHUB_REF_NAME#v}.apk"
          aab="runner-${GITHUB_REF_NAME#v}.aab" # Play 스토어 업로드용
          mv apk/release/app-release.apk "$apk"
          mv bundle/release/app-release.aab "$aab"
          # 주석 태그(git tag -a)의 메시지를 변경사항으로 쓴다. 가벼운 태그면 비워 둔다.
          sha=$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')
          changes=""
          [ -n "$sha" ] && changes="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .message)"$'\n\n'
          gh release create "$GITHUB_REF_NAME" "$apk" "$aab" \
            --title "러너 $GITHUB_REF_NAME" \
            --notes "${changes}안드로이드 8.0 이상 폰에서 APK를 받아 설치하세요 (출처를 알 수 없는 앱 허용 필요). 피드백은 https://github.com/$GITHUB_REPOSITORY/issues 에 남겨주세요." \
            --generate-notes

  # Play 비공개 테스트(alpha) 트랙에 초안으로 올린다. 출시 버튼은 Play Console에서 직접. 시크릿이 없으면 건너뛴다.
  play:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check Play service account
        id: sa
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "ok=$([ -n "$SA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.sa.outputs.ok == 'true'
        with:
          name: runner-release-apk

      - uses: r0adkll/upload-google-play@v1.1.3
        if: steps.sa.outputs.ok == 'true'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.hamaraman.runner
          releaseFiles: bundle/release/app-release.aab
          track: alpha
          status: draft
