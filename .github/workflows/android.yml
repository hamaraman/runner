name: Android build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          grep -qF "versionName = \"${GITHUB_REF_NAME#v}\"" app/build.gradle.kts ||
            { echo "::error::tag $GITHUB_REF_NAME does not match versionName in app/build.gradle.kts"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (core logic)
        run: ./gradlew :core:test --no-daemon

      - name: Naver Map client ID
        run: echo "naverMapClientId=${{ secrets.NAVER_MAP_CLIENT_ID }}" >> local.properties

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: runner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: runner-debug-apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk="runner-${GITHUB_REF_NAME#v}-debug.apk"
          mv app-debug.apk "$apk"
          # 주석 태그(git tag -a)의 메시지를 변경사항으로 쓴다. 가벼운 태그면 비워 둔다.
          sha=$(gh api "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')
          changes=""
          [ -n "$sha" ] && changes="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .message)"$'\n\n'
          gh release create "$GITHUB_REF_NAME" "$apk" \
            --title "러너 $GITHUB_REF_NAME" \
            --notes "${changes}안드로이드 8.0 이상 폰에서 APK를 받아 설치하세요 (출처를 알 수 없는 앱 허용 필요). 피드백은 https://github.com/$GITHUB_REPOSITORY/issues 에 남겨주세요." \
            --generate-notes
